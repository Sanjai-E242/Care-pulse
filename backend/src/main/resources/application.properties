spring.application.name=carepulse-backend
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Configuration (Supabase PostgreSQL / Cloud DB with local MySQL fallback)
spring.datasource.url=${SUPABASE_DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/carepulse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DATABASE_PASSWORD:SpeakWise@123}}

# JPA / Hibernate Configuration (Dialect auto-detected from connection metadata)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Authentication
carepulse.jwt.secret=${JWT_SECRET:CarePulseAiSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256}
carepulse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://care-curse.vercel.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8080,http://localhost:5174}

# AI Configuration (Supports external LLM or local fallback)
carepulse.ai.api-key=${AI_API_KEY:}
carepulse.ai.model=${AI_MODEL:gemini-1.5-flash}

# OpenAPI Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.carepulse=INFO
logging.level.org.springframework.security=WARN